<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #A78BFA;
        --primary-bg: #F5F3FF;
        --success: #F59E0B;
        --success-dark: #D97706;
        --success-bg: #FFFBEB;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --danger-bg: #FEF2F2;
        --gray-50: #F9FAFB;
        --gray-100: #F3F4F6;
        --gray-200: #E5E7EB;
        --gray-300: #D1D5DB;
        --gray-400: #9CA3AF;
        --gray-500: #6B7280;
        --gray-600: #4B5563;
        --gray-700: #374151;
        --gray-800: #1F2937;
        --gray-900: #111827;
        --white: #FFFFFF;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        --radius: 10px;
        --radius-lg: 14px;
        --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #F5F3FF 0%, #FDF4E3 100%);
        color: var(--gray-800);
        min-height: 100vh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 36px;
        padding: 28px 20px;
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary) 0%, var(--success) 100%);
      }

      .header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--gray-900);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .header h1 .accent {
        color: var(--primary);
      }

      .header p {
        margin-top: 8px;
        font-size: 0.95rem;
        color: var(--gray-500);
      }

      /* Cards / Sections */
      .card {
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        margin-bottom: 24px;
        overflow: hidden;
      }

      .card-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--gray-100);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .card-header h2 {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--gray-800);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-header h2 .icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .card-header h2 .icon svg {
        width: 16px;
        height: 16px;
      }

      .icon-purple { background: var(--primary-bg); color: var(--primary); }
      .icon-amber { background: var(--success-bg); color: var(--success-dark); }

      .card-body { padding: 24px; }

      /* Form */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group.full { grid-column: 1 / -1; }

      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gray-700);
      }

      .form-group label .req { color: var(--danger); margin-left: 2px; }

      .form-group input,
      .form-group textarea,
      .form-group select {
        padding: 10px 14px;
        border: 1.5px solid var(--gray-200);
        border-radius: var(--radius);
        font-size: 0.9rem;
        color: var(--gray-800);
        background: var(--white);
        transition: border-color var(--transition), box-shadow var(--transition);
        font-family: inherit;
        width: 100%;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 70px;
      }

      .form-group input.error,
      .form-group textarea.error,
      .form-group select.error {
        border-color: var(--danger);
      }

      .field-error {
        font-size: 0.8rem;
        color: var(--danger);
        min-height: 0;
        overflow: hidden;
        max-height: 0;
        transition: max-height var(--transition);
      }

      .field-error.show { max-height: 20px; }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        font-family: inherit;
        white-space: nowrap;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn svg { width: 16px; height: 16px; }

      .btn-primary {
        background: var(--primary);
        color: var(--white);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-success {
        background: var(--success);
        color: var(--white);
      }
      .btn-success:hover:not(:disabled) {
        background: var(--success-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-danger {
        background: var(--danger);
        color: var(--white);
      }
      .btn-danger:hover:not(:disabled) {
        background: var(--danger-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-ghost {
        background: var(--gray-100);
        color: var(--gray-700);
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--gray-200);
      }

      .btn-sm {
        padding: 7px 14px;
        font-size: 0.82rem;
      }

      .form-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 20px;
      }

      /* Stats bar */
      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .stat-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 100px;
        font-size: 0.82rem;
        font-weight: 600;
        background: var(--gray-50);
        color: var(--gray-600);
        border: 1px solid var(--gray-200);
      }

      .stat-pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      /* Table */
      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      thead th {
        text-align: left;
        padding: 14px 20px;
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--gray-400);
        border-bottom: 1.5px solid var(--gray-100);
        background: var(--gray-50);
      }

      thead th:first-child { padding-left: 24px; }
      thead th:last-child { text-align: center; }

      tbody tr {
        border-bottom: 1px solid var(--gray-100);
        transition: background var(--transition);
      }

      tbody tr:hover { background: var(--primary-bg); }
      tbody tr:last-child { border-bottom: none; }

      tbody td {
        padding: 16px 20px;
        color: var(--gray-700);
        vertical-align: middle;
      }

      tbody td:first-child { padding-left: 24px; }
      tbody td:last-child { text-align: center; white-space: nowrap; }

      .course-name {
        font-weight: 600;
        color: var(--gray-900);
      }

      .course-desc {
        font-size: 0.85rem;
        color: var(--gray-500);
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .course-date {
        font-variant-numeric: tabular-nums;
        color: var(--gray-600);
        font-size: 0.85rem;
      }

      .course-id {
        font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
        font-size: 0.78rem;
        color: var(--gray-400);
      }

      .created-at {
        font-size: 0.78rem;
        color: var(--gray-400);
      }

      /* Status badges */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 100px;
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .badge .dot { width: 6px; height: 6px; border-radius: 50%; }

      .badge-not-started {
        background: var(--gray-100);
        color: var(--gray-600);
      }
      .badge-not-started .dot { background: var(--gray-400); }

      .badge-in-progress {
        background: var(--success-bg);
        color: var(--success-dark);
      }
      .badge-in-progress .dot { background: var(--success); }

      .badge-completed {
        background: #ECFDF5;
        color: #059669;
      }
      .badge-completed .dot { background: #10B981; }

      .row-actions {
        display: inline-flex;
        gap: 8px;
      }

      /* Empty / Loading / Error states */
      .state-box {
        text-align: center;
        padding: 48px 24px;
        color: var(--gray-400);
      }

      .state-box .state-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--gray-100);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .state-box .state-icon svg {
        width: 26px;
        height: 26px;
        color: var(--gray-400);
      }

      .state-box h3 {
        font-size: 1rem;
        color: var(--gray-600);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .state-box p {
        font-size: 0.88rem;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--gray-200);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 14px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Toast notifications */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 380px;
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        background: var(--white);
        border-left: 4px solid var(--gray-300);
        animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 0.88rem;
      }

      .toast.success { border-left-color: var(--success); }
      .toast.error { border-left-color: var(--danger); }
      .toast.info { border-left-color: var(--primary); }

      .toast .toast-icon {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toast.success .toast-icon { background: var(--success-bg); color: var(--success-dark); }
      .toast.error .toast-icon { background: var(--danger-bg); color: var(--danger-dark); }
      .toast.info .toast-icon { background: var(--primary-bg); color: var(--primary); }

      .toast .toast-icon svg { width: 14px; height: 14px; }

      .toast .toast-body { flex: 1; }
      .toast .toast-title { font-weight: 600; color: var(--gray-800); }
      .toast .toast-msg { color: var(--gray-500); font-size: 0.82rem; margin-top: 2px; }

      .toast .toast-close {
        background: none;
        border: none;
        color: var(--gray-400);
        cursor: pointer;
        padding: 2px;
        flex-shrink: 0;
      }
      .toast .toast-close svg { width: 16px; height: 16px; }
      .toast .toast-close:hover { color: var(--gray-600); }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.5);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 900;
        padding: 20px;
        animation: fadeIn 0.15s ease;
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .modal {
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.96) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--gray-100);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-header h3 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--gray-900);
      }

      .modal-close {
        background: var(--gray-100);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--gray-500);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition);
      }
      .modal-close:hover { background: var(--gray-200); color: var(--gray-700); }
      .modal-close svg { width: 18px; height: 18px; }

      .modal-body { padding: 24px; }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--gray-100);
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      /* Inline loading */
      .btn .spinner-sm {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: var(--white);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .app { padding: 20px 14px 48px; }
        .header { padding: 22px 16px; }
        .header h1 { font-size: 1.35rem; }
        .form-grid { grid-template-columns: 1fr; }
        .card-body { padding: 18px; }
        .card-header { padding: 16px 18px; flex-wrap: wrap; }
        thead { display: none; }
        tbody tr {
          display: block;
          padding: 16px;
          border-bottom: 1px solid var(--gray-100);
        }
        tbody tr:last-child { border-bottom: none; }
        tbody td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 6px 0;
          text-align: right;
          border: none;
        }
        tbody td:first-child { padding-left: 0; }
        tbody td:last-child { text-align: right; }
        tbody td::before {
          content: attr(data-label);
          font-weight: 600;
          color: var(--gray-400);
          font-size: 0.78rem;
          text-transform: uppercase;
          letter-spacing: 0.03em;
          text-align: left;
          margin-right: 16px;
        }
        .course-desc { max-width: 180px; }
        .toast-container { left: 14px; right: 14px; max-width: none; }
      }

      @media (max-width: 480px) {
        .header h1 { font-size: 1.15rem; }
        .stats { gap: 8px; }
        .stat-pill { font-size: 0.76rem; padding: 6px 11px; }
        .btn-sm { padding: 8px 12px; font-size: 0.78rem; }
        .row-actions { flex-direction: column; gap: 6px; }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div class="app">
      <div class="header">
        <h1><span class="accent">CodeCraftHub:</span> Your Learning Management Platform</h1>
        <p>Plan, track, and complete your learning journey — all in one place.</p>
      </div>

      <!-- Add Course Form -->
      <div class="card">
        <div class="card-header">
          <h2>
            <span class="icon icon-purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
            Add New Course
          </h2>
        </div>
        <div class="card-body">
          <form id="course-form" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="name">Course Name<span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Advanced JavaScript" autocomplete="off" />
                <span class="field-error" id="err-name"></span>
              </div>
              <div class="form-group">
                <label for="target_date">Target Date<span class="req">*</span></label>
                <input type="date" id="target_date" name="target_date" />
                <span class="field-error" id="err-target_date"></span>
              </div>
              <div class="form-group full">
                <label for="description">Description<span class="req">*</span></label>
                <textarea id="description" name="description" placeholder="Briefly describe what this course covers..."></textarea>
                <span class="field-error" id="err-description"></span>
              </div>
              <div class="form-group">
                <label for="status">Status<span class="req">*</span></label>
                <select id="status" name="status">
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
                <span class="field-error" id="err-status"></span>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="reset-btn">Reset</button>
              <button type="submit" class="btn btn-primary" id="submit-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Course
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Course List -->
      <div class="card">
        <div class="card-header">
          <h2>
            <span class="icon icon-amber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            My Courses
          </h2>
          <div class="stats" id="stats"></div>
        </div>
        <div class="table-wrap">
          <table id="course-table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="course-tbody"></tbody>
          </table>
          <div id="state-container"></div>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal container -->
    <div id="modal-container"></div>

    <script>
      (function () {
        'use strict';

        var API_URL = 'https://webadmin1-5000.theianext-1-labs-prod-misc-tools-us-east-0.proxy.cognitiveclass.ai/api/courses';

        // ---- DOM refs ----
        var form = document.getElementById('course-form');
        var tbody = document.getElementById('course-tbody');
        var stateContainer = document.getElementById('state-container');
        var statsEl = document.getElementById('stats');
        var toastContainer = document.getElementById('toast-container');
        var modalContainer = document.getElementById('modal-container');
        var submitBtn = document.getElementById('submit-btn');
        var resetBtn = document.getElementById('reset-btn');

        var courses = [];
        var isLoading = false;

        // ---- Icons ----
        var icons = {
          empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
          error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
          edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
          trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
          check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>',
          alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
          close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
        };

        // ---- Utilities ----
        function escapeHtml(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatDate(dateStr) {
          if (!dateStr) return '—';
          var d = new Date(dateStr);
          if (isNaN(d.getTime())) return escapeHtml(dateStr);
          return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatDateTime(dateStr) {
          if (!dateStr) return '—';
          var d = new Date(dateStr);
          if (isNaN(d.getTime())) return escapeHtml(dateStr);
          return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function statusClass(status) {
          if (status === 'In Progress') return 'badge-in-progress';
          if (status === 'Completed') return 'badge-completed';
          return 'badge-not-started';
        }

        function badgeHtml(status) {
          return '<span class="badge ' + statusClass(status) + '"><span class="dot"></span>' + escapeHtml(status) + '</span>';
        }

        // ---- Toast ----
        function toast(type, title, message) {
          var el = document.createElement('div');
          el.className = 'toast ' + type;
          var iconKey = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'alert';
          el.innerHTML =
            '<div class="toast-icon">' + icons[iconKey] + '</div>' +
            '<div class="toast-body"><div class="toast-title">' + escapeHtml(title) + '</div>' +
            (message ? '<div class="toast-msg">' + escapeHtml(message) + '</div>' : '') + '</div>' +
            '<button class="toast-close" aria-label="Close">' + icons.close + '</button>';
          toastContainer.appendChild(el);
          var remove = function () {
            el.style.opacity = '0';
            el.style.transform = 'translateX(20px)';
            el.style.transition = 'all 0.2s';
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
          };
          el.querySelector('.toast-close').addEventListener('click', remove);
          setTimeout(remove, 4500);
        }

        // ---- State rendering ----
        function showLoading(msg) {
          tbody.innerHTML = '';
          stateContainer.innerHTML =
            '<div class="state-box"><div class="spinner"></div>' +
            '<h3>' + escapeHtml(msg || 'Loading courses...') + '</h3></div>';
        }

        function showError(msg) {
          tbody.innerHTML = '';
          stateContainer.innerHTML =
            '<div class="state-box"><div class="state-icon">' + icons.error + '</div>' +
            '<h3>Something went wrong</h3><p>' + escapeHtml(msg) + '</p></div>';
        }

        function showEmpty() {
          tbody.innerHTML = '';
          stateContainer.innerHTML =
            '<div class="state-box"><div class="state-icon">' + icons.empty + '</div>' +
            '<h3>No courses yet</h3><p>Add your first course using the form above.</p></div>';
        }

        function clearState() {
          stateContainer.innerHTML = '';
        }

        function renderStats() {
          var counts = { 'Not Started': 0, 'In Progress': 0, 'Completed': 0 };
          courses.forEach(function (c) {
            if (counts[c.status] !== undefined) counts[c.status]++;
          });
          var colors = {
            'Not Started': 'var(--gray-400)',
            'In Progress': 'var(--success)',
            'Completed': '#10B981'
          };
          statsEl.innerHTML =
            '<span class="stat-pill"><span class="dot" style="background:' + colors['Not Started'] + '"></span>Not Started: ' + counts['Not Started'] + '</span>' +
            '<span class="stat-pill"><span class="dot" style="background:' + colors['In Progress'] + '"></span>In Progress: ' + counts['In Progress'] + '</span>' +
            '<span class="stat-pill"><span class="dot" style="background:' + colors['Completed'] + '"></span>Completed: ' + counts['Completed'] + '</span>';
        }

        function renderTable() {
          if (isLoading) return;
          if (!courses.length) { showEmpty(); renderStats(); return; }
          clearState();
          renderStats();

          tbody.innerHTML = courses.map(function (c) {
            return '<tr>' +
              '<td data-label="Course" style="display:flex;flex-direction:column;align-items:flex-start">' +
                '<span class="course-name">' + escapeHtml(c.name) + '</span>' +
                '<span class="course-desc">' + escapeHtml(c.description) + '</span>' +
                '<span class="course-id">#' + escapeHtml(c.id) + '</span>' +
              '</td>' +
              '<td data-label="Target Date"><span class="course-date">' + formatDate(c.target_date) + '</span></td>' +
              '<td data-label="Status">' + badgeHtml(c.status) + '</td>' +
              '<td data-label="Created"><span class="created-at">' + formatDateTime(c.created_at) + '</span></td>' +
              '<td data-label="Actions"><div class="row-actions">' +
                '<button class="btn btn-ghost btn-sm" data-edit="' + c.id + '">' + icons.edit + ' Edit</button>' +
                '<button class="btn btn-danger btn-sm" data-delete="' + c.id + '">' + icons.trash + ' Remove</button>' +
              '</div></td>' +
            '</tr>';
          }).join('');

          tbody.querySelectorAll('[data-edit]').forEach(function (btn) {
            btn.addEventListener('click', function () { openEditModal(btn.getAttribute('data-edit')); });
          });
          tbody.querySelectorAll('[data-delete]').forEach(function (btn) {
            btn.addEventListener('click', function () { handleDelete(btn.getAttribute('data-delete')); });
          });
        }

        // ---- API ----
        function apiRequest(method, path, body) {
          var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
          if (body) opts.body = JSON.stringify(body);
          return fetch(API_URL + path, opts).then(function (res) {
            var ct = res.headers.get('content-type') || '';
            if (ct.indexOf('application/json') !== -1) {
              return res.json().then(function (data) {
                if (!res.ok) {
                  var msg = (data && (data.message || data.error || data.detail)) || 'Request failed (HTTP ' + res.status + ')';
                  var err = new Error(msg);
                  err.status = res.status;
                  err.data = data;
                  throw err;
                }
                return data;
              });
            }
            if (!res.ok) throw new Error('Request failed (HTTP ' + res.status + ')');
            return res.text();
          });
        }

        function fetchCourses() {
          isLoading = true;
          showLoading('Loading courses...');
          apiRequest('GET', '')
            .then(function (data) {
              courses = Array.isArray(data) ? data : (data.courses || data.data || []);
              isLoading = false;
              renderTable();
            })
            .catch(function (err) {
              isLoading = false;
              courses = [];
              showError(err.message || 'Could not connect to the server.');
              renderStats();
            });
        }

        function createCourse(payload) {
          return apiRequest('POST', '', payload);
        }

        function updateCourse(id, payload) {
          return apiRequest('PUT', '/' + encodeURIComponent(id), payload);
        }

        function deleteCourse(id) {
          return apiRequest('DELETE', '/' + encodeURIComponent(id));
        }

        // ---- Form validation ----
        function clearFieldErrors() {
          ['name', 'description', 'target_date', 'status'].forEach(function (f) {
            var field = document.getElementById(f);
            var err = document.getElementById('err-' + f);
            if (field) field.classList.remove('error');
            if (err) { err.textContent = ''; err.classList.remove('show'); }
          });
        }

        function setFieldError(field, msg) {
          var el = document.getElementById(field);
          var err = document.getElementById('err-' + field);
          if (el) el.classList.add('error');
          if (err) { err.textContent = msg; err.classList.add('show'); }
        }

        function validateForm(data) {
          clearFieldErrors();
          var valid = true;
          if (!data.name || !data.name.trim()) { setFieldError('name', 'Course name is required.'); valid = false; }
          if (!data.description || !data.description.trim()) { setFieldError('description', 'Description is required.'); valid = false; }
          if (!data.target_date) { setFieldError('target_date', 'Target date is required.'); valid = false; }
          else if (isNaN(new Date(data.target_date).getTime())) { setFieldError('target_date', 'Enter a valid date.'); valid = false; }
          if (!data.status) { setFieldError('status', 'Please select a status.'); valid = false; }
          return valid;
        }

        function getFormData() {
          return {
            name: form.name.value.trim(),
            description: form.description.value.trim(),
            target_date: form.target_date.value,
            status: form.status.value
          };
        }

        // ---- Submit handler ----
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var data = getFormData();
          if (!validateForm(data)) {
            toast('error', 'Validation Error', 'Please fill in all required fields.');
            return;
          }
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-sm"></span> Adding...';
          createCourse(data)
            .then(function () {
              toast('success', 'Course Added', '"' + data.name + '" has been created.');
              form.reset();
              fetchCourses();
            })
            .catch(function (err) {
              toast('error', 'Could Not Add Course', err.message);
            })
            .finally(function () {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Course';
            });
        });

        resetBtn.addEventListener('click', function () {
          form.reset();
          clearFieldErrors();
        });

        // ---- Delete handler ----
        function handleDelete(id) {
          var course = courses.find(function (c) { return String(c.id) === String(id); });
          var label = course ? course.name : 'this course';
          if (!confirm('Are you sure you want to remove "' + label + '"? This cannot be undone.')) return;

          var btn = tbody.querySelector('[data-delete="' + id + '"]');
          if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-sm"></span>';
          }
          deleteCourse(id)
            .then(function () {
              toast('success', 'Course Removed', '"' + label + '" has been deleted.');
              fetchCourses();
            })
            .catch(function (err) {
              toast('error', 'Could Not Delete', err.message);
              if (btn) {
                btn.disabled = false;
                btn.innerHTML = icons.trash + ' Remove';
              }
            });
        }

        // ---- Edit modal ----
        function openEditModal(id) {
          var course = courses.find(function (c) { return String(c.id) === String(id); });
          if (!course) return;

          modalContainer.innerHTML =
            '<div class="modal-overlay">' +
              '<div class="modal">' +
                '<div class="modal-header">' +
                  '<h3>Edit Course</h3>' +
                  '<button class="modal-close" id="modal-close">' + icons.close + '</button>' +
                '</div>' +
                '<div class="modal-body">' +
                  '<div class="form-grid">' +
                    '<div class="form-group full">' +
                      '<label for="m-name">Course Name<span class="req">*</span></label>' +
                      '<input type="text" id="m-name" value="' + escapeHtml(course.name) + '" />' +
                      '<span class="field-error" id="m-err-name"></span>' +
                    '</div>' +
                    '<div class="form-group full">' +
                      '<label for="m-description">Description<span class="req">*</span></label>' +
                      '<textarea id="m-description">' + escapeHtml(course.description) + '</textarea>' +
                      '<span class="field-error" id="m-err-description"></span>' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label for="m-target_date">Target Date<span class="req">*</span></label>' +
                      '<input type="date" id="m-target_date" value="' + escapeHtml(course.target_date ? course.target_date.split('T')[0] : '') + '" />' +
                      '<span class="field-error" id="m-err-target_date"></span>' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label for="m-status">Status<span class="req">*</span></label>' +
                      '<select id="m-status">' +
                        '<option value="Not Started"' + (course.status === 'Not Started' ? ' selected' : '') + '>Not Started</option>' +
                        '<option value="In Progress"' + (course.status === 'In Progress' ? ' selected' : '') + '>In Progress</option>' +
                        '<option value="Completed"' + (course.status === 'Completed' ? ' selected' : '') + '>Completed</option>' +
                      '</select>' +
                      '<span class="field-error" id="m-err-status"></span>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="modal-footer">' +
                  '<button class="btn btn-ghost" id="modal-cancel">Cancel</button>' +
                  '<button class="btn btn-primary" id="modal-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Save Changes</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          var overlay = modalContainer.querySelector('.modal-overlay');
          var closeBtn = document.getElementById('modal-close');
          var cancelBtn = document.getElementById('modal-cancel');
          var saveBtn = document.getElementById('modal-save');

          function closeModal() {
            modalContainer.innerHTML = '';
          }

          closeBtn.addEventListener('click', closeModal);
          cancelBtn.addEventListener('click', closeModal);
          overlay.addEventListener('click', function (e) {
            if (e.target === overlay) closeModal();
          });
          document.addEventListener('keydown', function esc(e) {
            if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', esc); }
          });

          function modalValidate(data) {
            var ok = true;
            var fields = [
              ['name', 'm-name', 'm-err-name', 'Course name is required.'],
              ['description', 'm-description', 'm-err-description', 'Description is required.'],
              ['target_date', 'm-target_date', 'm-err-target_date', 'Target date is required.'],
              ['status', 'm-status', 'm-err-status', 'Status is required.']
            ];
            fields.forEach(function (f) {
              var el = document.getElementById(f[1]);
              var err = document.getElementById(f[2]);
              el.classList.remove('error');
              err.textContent = ''; err.classList.remove('show');
              if (!data[f[0]] || (typeof data[f[0]] === 'string' && !data[f[0]].trim())) {
                el.classList.add('error'); err.textContent = f[3]; err.classList.add('show'); ok = false;
              }
            });
            return ok;
          }

          saveBtn.addEventListener('click', function () {
            var payload = {
              name: document.getElementById('m-name').value.trim(),
              description: document.getElementById('m-description').value.trim(),
              target_date: document.getElementById('m-target_date').value,
              status: document.getElementById('m-status').value
            };
            if (!modalValidate(payload)) return;

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-sm"></span> Saving...';
            updateCourse(id, payload)
              .then(function () {
                toast('success', 'Course Updated', '"' + payload.name + '" has been saved.');
                closeModal();
                fetchCourses();
              })
              .catch(function (err) {
                toast('error', 'Could Not Update', err.message);
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Save Changes';
              });
          });

          document.getElementById('m-name').focus();
        }

        // ---- Init ----
        fetchCourses();
      })();
    </script>
  </body>
</html>
